name: Refresh university and course data

# Pulls the latest Discover Uni course list and Wikidata university facts,
# then commits src/data/*.json if anything changed. Vercel redeploys on the push.
on:
  schedule:
    - cron: '17 4 * * 1'   # every Monday 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main, data-pipeline]
    paths: ['tools/fetch-data.mjs', '.github/workflows/refresh-data.yml']

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch data
        run: node tools/fetch-data.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data; then echo "No data changes"; exit 0; fi
          git config user.name "learnuk-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "Refresh university and course data"
          git push
